    <rect x="1010" y="59" width="526" height="369" rx="20" fill="#111f31" stroke="#314258" stroke-width="2"/>
    <text x="1041" y="105" fill="#a5b7cc" font-size="26" font-weight="650" letter-spacing="2">LINUX HOST</text>
    <text x="1041" y="146" fill="#e7eef7" font-size="28" font-weight="600">Google Cloud · x86_64 / KVM</text>
    <path d="M1273 155V175" fill="none" stroke="#37dfc5" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1035" y="183" width="476" height="220" rx="16" fill="#0d1e31" stroke="#37dfc5" stroke-width="2"/>
