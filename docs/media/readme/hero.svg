    <text x="67" y="225" fill="#a5b7cc" font-size="32" letter-spacing="0.3">Android · Flutter · JVM · AOSP</text>
    <text x="64" y="322" fill="#e7eef7" font-size="47" font-weight="700" letter-spacing="-1">Source-built Android 16.</text>
    <text x="64" y="381" fill="#e7eef7" font-size="42" font-weight="600" letter-spacing="-0.8">Built &amp; exercised on real Linux.</text>
    <circle cx="76" cy="435" r="6" fill="#37dfc5"/>
