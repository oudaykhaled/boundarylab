<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">BoundaryLab: source-built Android 16, exercised on a real Linux server</title>
  <desc id="hero-desc">A documentation illustration of the actual test topology: a Google Cloud Linux x86_64 host with KVM ran a Cuttlefish Android 16 guest containing BoundaryLab's native Binder service. The minimum AOSP proof recorded 34 operator checks, 236 harness observations and 61 native assertions. These are separate layers, not a sum of unique tests. The diagram is not a server screenshot or recorded execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#37dfc5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="620" rx="24" fill="#09111f"/>
  <path d="M64 59H90V85M64 59V85M64 85H90" fill="none" stroke="#37dfc5" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 59H130V85M104 85H130" fill="none" stroke="#37dfc5" stroke-width="5" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
