    <rect x="1066" y="276" width="414" height="103" rx="12" fill="#10302f" stroke="#37dfc5" stroke-width="2"/>
    <text x="1273" y="318" text-anchor="middle" fill="#e7eef7" font-size="30" font-weight="650">Native Binder service</text>
    <text x="1273" y="356" text-anchor="middle" fill="#37dfc5" font-size="26">Frozen AIDL V1 · SELinux</text>
    <text x="1273" y="471" text-anchor="middle" fill="#a5b7cc" font-size="26">Architecture illustration · not a capture</text>

    <path d="M64 509H1536" fill="none" stroke="#314258" stroke-width="2"/>
