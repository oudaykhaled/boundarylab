name: boundarylab
version: 0.1.0
description: Android Binder adapter for BoundaryLab, with opaque native file selections.
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.boundarylab.flutter
        pluginClass: BoundaryLabPlugin
