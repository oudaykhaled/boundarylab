name: Build and local tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.profile }} checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: jvm, os: ubuntu-24.04 }
          - { profile: jvm, os: macos-14 }
          - { profile: android, os: ubuntu-24.04 }
          - { profile: reference, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify official wrapper checksum
        run: python3 scripts/verify-wrapper.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.profile != 'reference'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: matrix.profile != 'reference'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.profile != 'reference'
        with:
          packages: platform-tools
      - name: Install pinned Android SDK for all Gradle project configuration
        if: matrix.profile != 'reference'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run bounded checks
        run: python3 scripts/check.py '${{ matrix.profile }}' --timeout-seconds 1200
      - name: Prepare disposable independently signed denial probe
        if: matrix.profile == 'android'
        run: python3 scripts/prepare-denied-signing.py --directory "$RUNNER_TEMP/denied-signing" --github-env "$GITHUB_ENV"
      - name: Build denial probe and instrumentation APKs (no device execution)
        if: matrix.profile == 'android'
        timeout-minutes: 5
        run: ./gradlew --no-daemon --console=plain :android:denied-client:assembleDebug :android:denied-client:assembleDebugAndroidTest
      - name: Retain logs, JUnit XML, lint and debug build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-build-check-${{ matrix.profile }}-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/evidence/
            **/build/test-results/
            **/build/reports/
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/androidTest/debug/*.apk
            **/build/outputs/aar/*-debug.aar

  flutter:
    name: Flutter checks and matched broker/native/Flutter debug builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.9'
          channel: stable
      - name: Install pinned Flutter Android dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Check SDK and app, then build debug APK
        run: python3 scripts/check-flutter.py
      - name: Build broker and native client with the same runner debug signer
        timeout-minutes: 10
        run: ./gradlew --no-daemon --console=plain :android:broker:assembleDebug :examples:android-native:assembleDebug
      - name: Verify matching APK certificates and package public provenance
        run: python3 scripts/package-matched-apks.py
      - name: Retain matched three-APK set and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matched-3apk-debug-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: build/evidence/matched-client-suite/
      - name: Retain sanitized Flutter check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-local-checks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/evidence/flutter/
